        function carregaJovensJaAcompanhadosObreiro() {
            var url_ = new URL(location.href);
            var vIdObreiro = url_.searchParams.get("xbro");
            var vNomeObreiro = url_.searchParams.get("nomeObreiro");

            console.log(vIdObreiro);
            var obreiroDTO = {
                IdObreiroX: vIdObreiro
            };

            $.ajax({
                type: "POST",
                data: JSON.stringify(obreiroDTO),
                url: 'api/ArvoreVida/ListaJovensAcompanhadosPorObreiroSafe',
                contentType: "application/json"
            }).done(function (resultSetJovensJaAcompanhadosObreiro) {
                var idform = 'frmJovemEmAcompanhamento';

                if (resultSetJovensJaAcompanhadosObreiro.length == 0) {
                    swal({
                            title: "Notificação",
                            text: 'Ainda não existem jovens sendo acompanhados por este obreiro!',
                            type: "warning"
                    }, function () {
                            window.close();
                    });
                    //alert('ainda não existem jovens sendo acompanhados por este obreiro!');
                }
                else {
                    $(document.body).append(__TEMPLATE_HEADER_OBREIRO_ACOMPANHAMENTO.replace('#NOME_OBREIRO#', vNomeObreiro));
                    $(document.body).append('<br />');
                    for (var i = 0; i < resultSetJovensJaAcompanhadosObreiro.length; i++) {
                        idform += i;

                        var vEhBtzAguas_s = '';
                        var vEhBtzAguas_n = '';
                        var vEhBtzES_s = '';
                        var vEhBtzES_n = '';
                        var vF_IURD_s = '';
                        var vF_IURD_n = '';

                        if (resultSetJovensJaAcompanhadosObreiro[i].EhBatizadoAguas == 'S') {
                            vEhBtzAguas_s = 'checked';
                            vEhBtzAguas_n = '';
                        }
                        else {
                            vEhBtzAguas_s = '';
                            vEhBtzAguas_n = 'checked';
                        }

                        if (resultSetJovensJaAcompanhadosObreiro[i].EhBatizadoEspiritoSanto == 'S') {
                            vEhBtzES_s = 'checked';
                            vEhBtzES_n = '';
                        }
                        else {
                            vEhBtzES_s = '';
                            vEhBtzES_n = 'checked';
                        }

                        if (resultSetJovensJaAcompanhadosObreiro[i].FoiNaIurd == 'S') {
                            vF_IURD_s = 'checked';
                            vF_IURD_n = '';
                        }
                        else {
                            vF_IURD_s = '';
                            vF_IURD_n = 'checked';
                        }

                        $(document.body).append(
                            __TEMPLATE_TABLE_FICHA_ACOMPANHAMENTO
                                .replace('#NOME#', resultSetJovensJaAcompanhadosObreiro[i].NomeJovem)
                                .replace('#DATANASCIMENTO#', resultSetJovensJaAcompanhadosObreiro[i].DataNascimento)
                                .replace('#FOTO_JOVEM#', __HOST_CONFIGURADO + 'FotosJovens/' + resultSetJovensJaAcompanhadosObreiro[i].NomeArquivoFoto)
                                .replace('#ESTADO#', resultSetJovensJaAcompanhadosObreiro[i].NomeEstado)
                                .replace('#BLOCO#', resultSetJovensJaAcompanhadosObreiro[i].NomeBlocoJovem)
                                .replace('#REGIAO#', resultSetJovensJaAcompanhadosObreiro[i].NomeRegiaoJovem)
                                .replace('#IGREJA#', resultSetJovensJaAcompanhadosObreiro[i].NomeIgrejaJovem)
                                .replace('#WHATSAPP#', resultSetJovensJaAcompanhadosObreiro[i].Whatsapp)
                                .replace('#ECIVIL#', resultSetJovensJaAcompanhadosObreiro[i].EstadoCivil)
                                .replace('#ENDERECO#', resultSetJovensJaAcompanhadosObreiro[i].Endereco)
                                .replace('#DATAINGRESSOUFJU#', resultSetJovensJaAcompanhadosObreiro[i].DataIngressouFJU)
                                .replace('#PROJETOJOVEM#', resultSetJovensJaAcompanhadosObreiro[i].ProjetoJovemPertence)
                                .replace('#DESCCONHECEUFJU#', resultSetJovensJaAcompanhadosObreiro[i].ComoConheceuFJU)
                                .replace('#DATABTZAGUAS#', resultSetJovensJaAcompanhadosObreiro[i].DataBatismoAguas)   
                                .replace('#Eh_btzA_s#', vEhBtzAguas_s)
                                .replace('#Eh_btzA_n#', vEhBtzAguas_n)
                                .replace('#Eh_btzES_s#', vEhBtzES_s)
                                .replace('#Eh_btzES_n#', vEhBtzES_n)
                                .replace('#f_na_IURD_s#', vF_IURD_s)
                                .replace('#f_na_IURD_n#', vF_IURD_n)
                                .replace('#dtaBatismoEspiritoSanto#', resultSetJovensJaAcompanhadosObreiro[i].DataBatismoEspiritoSanto)
