                    $('#tblJovensAcompanhados tbody').on('click', 'button', function () {
                        var tblJovensAcompanhados = $('#tblJovensAcompanhados').DataTable();
                        var classeDoBotao = $(this).prop('class');
                        var indiceDaLinha = tblJovensAcompanhados.row($(this).parents('tr')).index();
                        var idX = __resultSetTodosJovensAcompanhados[indiceDaLinha].IdX;
                        //var vNomeObreiro = encodeURI(__resultSetTodosObreiros[indiceDaLinha].NomeObreiro);
                        //dadoJovemSelecionado = __resultSetTodosObreiros[indiceDaLinha];

                            window.open(

                                '_blank'
                            );
                        else if (classeDoBotao == 'btn btn-warning btn-xs dt-view')
                           window.open(
                                     __HOST_CONFIGURADO + '/GerenciaAVRegistraHistorico.html?x=' + idX
                                  );
                        
                    });

                    $('#tblJovensAcompanhados tbody').on('click', 'td.details-control', function () {
                        var table = $('#tblJovensAcompanhados').DataTable();
                        var tr = $(this).closest('tr');
                        var row = table.row( tr );
 
                        if ( row.child.isShown() ) {
                            // This row is already open - close it
                            row.child.hide();
                            tr.removeClass('shown');
                        }
                        else {
                            // Open this row
                            row.child( formataRow(row.data()) ).show();
                            tr.addClass('shown');
                        }
                    });

                });


                function ObterJovensAcompanhadosPerfilLogado() {

                    }).done(function (resultSetJovensEmAcompanhamento) {
                        __resultSetTodosJovensAcompanhados = resultSetJovensEmAcompanhamento;

                        $('#tblJovensAcompanhados').DataTable({
                            data: resultSetJovensEmAcompanhamento,
                            pageLength: 50,
                            destroy: true,
                            dom: 'Bfrtip',
                            buttons: [
                            ],
                            columns: [
                                {
                                    "className":      'details-control',
                                    "orderable":      false,
                                    "data":           null,
                                    "defaultContent": ''
                                },
                                { data: 'IdX' },
                                {
                                    data: 'NomeArquivoFotoFormatado',
                                    render: function (data, type, row) {
                                        return "<img src=" + row.NomeArquivoFotoFormatado + " class='rounded-circle img-sm'  />";
                                    }
                                },

                }

                function PesquisaJovensAcompanhadosPorParametro() {
                    spinnerOn();
                    $('#boxTodosObreiros').children('.ibox-content').toggleClass('sk-loading');
                    $('#boxObreiroSelecionado').children('.ibox-content').toggleClass('sk-loading');

                    var vIdEstado = $('#cboEstado').val();
                    var vIdBloco = $('#cboBloco').val();
                    var vIdRegiao = $('#cboRegiao').val();
                    var vIdIgreja = $('#cboIgreja').val();
                    
                    var parametroPesquisaDTO = {
                        IdEstado: vIdEstado,
                        IdBloco: vIdBloco,
                        IdRegiao: vIdRegiao,
                        IdIgreja: vIdIgreja
                    };

                    $.ajax({
                        type: "POST",
                        data: JSON.stringify(parametroPesquisaDTO),
                        url: 'api/ArvoreVidaConsulta/ListaJovensAcompanhadosPorParametro',
                        contentType: "application/json"
                    }).done(function (resultSetResultadoPesquisa) {

                        __resultSetTodosJovensAcompanhados = resultSetResultadoPesquisa;
                        
                        $('#tblJovensAcompanhados').DataTable({
                            data: resultSetResultadoPesquisa,
                            pageLength: 50,
                            destroy: true,
                            dom: 'Bfrtip',
                            buttons: [
                            ],
                            columns: [
                                {
                                    "className":      'details-control',
                                    "orderable":      false,
                                    "data":           null,
                                    "defaultContent": ''
                                },
                                { data: 'IdX' },
                                {
                                    data: 'NomeArquivoFotoFormatado',
                                    render: function (data, type, row) {
                                        return "<img src=" + row.NomeArquivoFotoFormatado + " class='rounded-circle img-sm'  />";
                                    }
                                },
                                { data: 'NomeJovem' },
                                { data: 'NomeRegiaoJovem' },
                                { data: 'NomeIgrejaJovem' },
                                {
                                    data: null,
                                    defaultContent: '<div class="btn-group"> <button type="button" alt="Histórico do Árvore da Vida" class="btn btn-success btn-xs dt-view" style="margin-right:16px;"><span class="fa fa-tree" aria-hidden="true"></span></button> <button type="button" alt="Histórico do Árvore da Vida" class="btn btn-warning btn-xs dt-view" style="margin-right:16px;"><span class="fa fa-tree" aria-hidden="true"></span><span class="fa fa-history" aria-hidden="true"></span></button> </div>'
                                }
                            ],
                            columnDefs: [
                                {
                                    targets: [1],
                                    visible: false,
                                    searchable: false
                                }
                            ]
                        });

                        $('#boxTodosObreiros').children('.ibox-content').toggleClass('sk-loading');
                        $('#boxObreiroSelecionado').children('.ibox-content').toggleClass('sk-loading');
                        spinnerOff();
                    });
                }


                function formataRow( pDadosObreiro ) {                

                    return '<table cellpadding="5" cellspacing="0" border="0" style="padding-left:50px;">' +
                        '<tr align="center">' +
                        '    <td class="text-danger font-bold" style="font-family: Tahoma" colspan="2">Obreiro que Acompanha este jovem</td>' +
                        '</tr>'+
                        '<tr>' +                                                
                            '<td class="font-bold">Nome <span class="fa fa-user-circle" aria-hidden="true"></span> </td>'+
                            '<td   class="text-success font-bold"> <a href="VisualizaJovemE.html?idJovem=' + pDadosObreiro.IdObreiroAcompanha + '" class="text-info" target="_blank">' + pDadosObreiro.NomeObreiroAcompanha + '</a></td>' +
