        $(document).ready(function () {


            $("#wizard").steps();
            $("#form").steps({
                bodyTag: "fieldset",
                onStepChanging: function (event, currentIndex, newIndex) {
                    // Always allow going backward even if the current step contains invalid fields!
                    if (currentIndex > newIndex) {
                        return true;
                    }

                    // Forbid suppressing "Warning" step if the user is to young
                    if (newIndex === 3 && Number($("#age").val()) < 18) {
                        return false;
                    }

                    var form = $(this);

                    // Clean up if user went backward before
                    if (currentIndex < newIndex) {
                        // To remove error styles
                        $(".body:eq(" + newIndex + ") label.error", form).remove();
                        $(".body:eq(" + newIndex + ") .error", form).removeClass("error");
                    }

                    // Disable validation on fields that are disabled or hidden.
                    form.validate().settings.ignore = ":disabled,:hidden";

                    // Start validation; Prevent going forward if false
                    return form.valid();
                },
                onStepChanged: function (event, currentIndex, priorIndex) {
                    // Suppress (skip) "Warning" step if the user is old enough.
                    if (currentIndex === 2 && Number($("#age").val()) >= 18) {
                        $(this).steps("next");
                    }

                    // Suppress (skip) "Warning" step if the user is old enough and wants to the previous step.
                    if (currentIndex === 2 && priorIndex === 3) {
                        $(this).steps("previous");
                    }
                },
                onFinishing: function (event, currentIndex) {
                    var form = $(this);

                    // Disable validation on fields that are disabled.
                    // At this point it's recommended to do an overall check (mean ignoring only disabled fields)
                    form.validate().settings.ignore = ":disabled";

                    // Start validation; Prevent form submission if false
                    return form.valid();
                },
                onFinished: function (event, currentIndex) {
                    var form = $(this);

                    // Submit form input
                    //form.submit();
                    //$('#ibox1').children('.ibox-content').toggleClass('sk-loading');
                    RegistrarNovaInstituicaoEnsino();
                }
            }).validate({
                errorPlacement: function (error, element) {
                    element.before(error);
                },
                rules: {
                }
            });

            $("#cboEstado").select2();
            $("#cboBloco").select2();
            $("#cboRegiao").select2();
            $("#cboIgreja").select2();


            $('.select2_demo_3').on('select2:select', function (e) {
                $('#ibox1').children('.ibox-content').toggleClass('sk-loading');//sk-loading
                var data = e.params.data;
                preencherComboBlocos(data.id);
            });

            $('.select2_demo_4').on('select2:select', function (e) {
                
                //$('#ibox1').children('.ibox-content').toggleClass('sk-loading');
                $('#cboRegiao').empty().trigger("change");
                $('#cboIgreja').empty().trigger("change");
                var data = e.params.data;

                preencherComboRegioes(data.id);
            });

            $('.select2_demo_5').on('select2:select', function (e) {
                //$('#ibox1').children('.ibox-content').toggleClass('sk-loading');//#spinner
                $('#cboIgreja').empty().trigger("change");
                var data = e.params.data;
                preencherComboIgrejas(data.id);
            });

            facadeUser.ConfigurarPaginaX072470();

            configComboEstado();

        });

        function configComboEstado() {
            $.ajax({
                type: "GET",
                url: "api/Usuarios/X072470/",
                contentType: "application/json"
            }).done(function (retorno) {
                //console.log(retorno.IdEstadoUsuarioLogado);
                $("#cboEstado").val(retorno.IdEstadoUsuarioLogado).trigger('change.select2');
                $('#cboEstado').prop("disabled", true);
                preencherComboBlocos(retorno.IdEstadoUsuarioLogado);
            });
        }

        function RegistrarNovaInstituicaoEnsino() {
            var msgValidacao = "";
            $('#ibox1').children('.ibox-content').toggleClass('sk-loading');
            
            if ($('#cboEstado').val() == '')
                msgValidacao += "O Estado não pode ficar em branco! \n";

            if ($('#txtNomeInstituicaoEnsino').val() == '') {
                msgValidacao += "O Nome da instituição não pode ficar em banco! \n";
            }

            if ($('#txtEndereco').val() == '') {
                msgValidacao += 'O endereço não pode ficar em branco! \n';
            }

            if (msgValidacao != '') {
                swal({
                    title: "Validação",
                    text: msgValidacao,
                    type: "error"
                }, function () {
                        return false;
                });
            }

            var novaInstituicaoEnsinoDTO = {
                NomeInstituicaoEnsino: $('#txtNomeInstituicaoEnsino').val(),
                Endereco: $('#txtEndereco').val(),
                Contato: $('#txtContato').val(),
                NomeContato: $('#txtNomeContato').val(),
                FuncaoContatoInstituicaoEnsino: $('#cboFuncaoContatoInstituicaoEnsino').val(),
                IdIgrejaInstituicao: $('#cboIgreja').val(),
                IdPerfilInstituicao: $('#cboPerfilInstituicaoEnsino').val(),
                IdTipoInstituicao: $('#cboTipoInstituicaoEnsino').val(),
                IdClassificacaoInstituicao: $('#cboClassificacaoInstituicaoEnsino').val()
            };

            $.ajax({
                type: "POST",
                data: JSON.stringify(novaInstituicaoEnsinoDTO),
                url: "api/InsitituicaoEnsino/RegistrarInstituicaoEnsino",
                contentType: "application/json"
            }).done(function (retornoRegistroInstituicaoEnsino) {
                if (retornoRegistroInstituicaoEnsino.RequisicaoBemSucedida) {
                    swal({
                        title: "Confirmação",
                        text: retornoRegistroInstituicaoEnsino.MensagemRespostaRequisicao,
                        type: "success"
                    });
                    limpaControles();
                }
                else
                    swal({
                        title: "Aviso",
                        text: retornoRegistroInstituicaoEnsino.MensagemRespostaRequisicao,
                        type: "error"
                    });
            });
        }

        function mensagemConfirmacaoCadastro() {
            var msgConfirmacaoCadastro = "Realizado com sucesso cadastro do atendente ";
            swal({
                title: "Atendente Cadastrado com sucesso !",
                text: msgConfirmacaoCadastro,
                type: "success"
            });
        }

        function habilitaCadastroNovoAtendente() {
            $('#btnNovo').prop('disabled', 'disabled');
            $('#btnSalvar').removeProp('disabled');
        }

        function limpaControles() {
            $('#txtNomeInstituicaoEnsino').val('');
            $('#txtEndereco').val('');
            $('#txtContato').val('');
            $('#txtNomeContato').val('');
            $('#cboBloco').val($('#cboBloco option:first-child').val()).trigger('change');
            $('#cboRegiao').empty().trigger('change');
            $('#cboIgreja').empty().trigger('change');
            $('#cboPerfilInstituicaoEnsino').val($('#cboPerfilInstituicaoEnsino option:first-child').val()).trigger('change');
            $('#cboTipoInstituicaoEnsino').val($('#cboTipoInstituicaoEnsino option:first-child').val()).trigger('change');
            $('#cboFuncaoContatoInstituicaoEnsino').val($('#cboFuncaoContatoInstituicaoEnsino option:first-child').val()).trigger('change');

            $('#ibox1').children('.ibox-content').toggleClass('sk-loading');
        }
